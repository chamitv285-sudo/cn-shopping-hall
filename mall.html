
<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>C&N SHOPPING HALL 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:Arial,sans-serif;background:#111827;color:white}
button{border:0;border-radius:12px;padding:11px 14px;font-weight:bold;cursor:pointer}
#game{position:fixed;inset:0}
#top{position:fixed;z-index:3;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;align-items:center;pointer-events:none}
.brand,.carttop{background:#101827e8;padding:11px;border-radius:12px;border:1px solid #ffffff35;pointer-events:auto}
.brand{color:#ffd166;font-weight:900}
.carttop{font-size:13px}
#hint{position:fixed;z-index:3;top:66px;left:50%;transform:translateX(-50%);background:#101827dd;border-radius:12px;padding:9px 12px;text-align:center;font-size:12px;width:max-content;max-width:94%}
#controls{position:fixed;z-index:4;bottom:17px;left:12px;display:grid;grid-template-columns:47px 47px 47px;gap:5px}
#controls button{height:45px;padding:2px;background:#18253eeb;color:white;border:1px solid #ffffff50;font-size:19px;touch-action:none}
#controls .empty{visibility:hidden}
#actions{position:fixed;z-index:4;right:12px;bottom:18px;display:flex;flex-direction:column;gap:8px}
#actions button{background:#ffd166;color:#152238;font-size:12px;min-width:100px}
#actions .other{background:#fff}
#panel{display:none;position:fixed;z-index:9;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;color:#182238;width:min(420px,92vw);max-height:82vh;overflow:auto;padding:18px;border-radius:20px;box-shadow:0 12px 60px #000a}
#panel img{width:100%;height:180px;object-fit:cover;border-radius:12px}
#panel h2{margin:10px 0}
#panel p{line-height:1.5}
#panel button{margin-top:8px}
#close{float:right;background:#eee}
.wide{width:100%;background:#087f5b;color:white}
#order{background:#1ca65b}
#clear{background:#e9edf3;color:#172238}
#footer{position:fixed;bottom:2px;left:50%;transform:translateX(-50%);z-index:2;font-size:9px;color:#ffffff9c;white-space:nowrap}
@media(max-width:430px){
.brand{font-size:11px;padding:9px}
.carttop{font-size:11px;padding:9px}
#controls{left:7px;bottom:12px;grid-template-columns:41px 41px 41px;gap:4px}
#controls button{height:41px}
#actions{right:7px;bottom:12px}
#actions button{min-width:88px;padding:10px 6px;font-size:11px}
}
</style>
</head>
<body>
<div id="game"></div>
<div id="top">
  <div class="brand">🛍️ C&N SHOPPING HALL</div>
  <div class="carttop">🛒 Cart: <b id="count">0</b></div>
</div>
<div id="hint">⬆️ ඇවිදින්න • තිරයේ දකුණු පැත්ත ඇදලා බලන දිශාව වෙනස් කරන්න</div>

<div id="controls">
  <span class="empty"></span><button data-m="f">⬆️</button><span class="empty"></span>
  <button data-m="l">⬅️</button><button data-m="b">⬇️</button><button data-m="r">➡️</button>
</div>
<div id="actions">
  <button id="cartButton">🛒 Cart එක</button>
  <button id="resetButton" class="other">🏬 ආරම්භයට</button>
</div>
<div id="panel">
  <button id="close">✕ වහන්න</button>
  <div id="content"></div>
</div>
<div id="footer">C&N SHOPPING HALL • 3D SHOPPING EXPERIENCE</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color('#b8d8ef');
scene.fog = new THREE.Fog('#b8d8ef',35,100);

const camera = new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,180);
const renderer = new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
document.getElementById('game').appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xe5f4ff,0x777b91,2.1));
const sun=new THREE.DirectionalLight(0xffffff,2.4);
sun.position.set(-9,18,9);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-30;
sun.shadow.camera.right=30;
sun.shadow.camera.top=30;
sun.shadow.camera.bottom=-30;
scene.add(sun);

function material(color,roughness=.7,metalness=0){
 return new THREE.MeshStandardMaterial({color,roughness,metalness});
}
const floorMat=material('#d9dee8',.3);
const wallMat=material('#f0f2f7');
const shelfMat=material('#28364d',.45,.15);
const goldMat=material('#e8b94e',.32,.3);

function box(w,h,d,x,y,z,mat,shadow=true){
 const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
 mesh.position.set(x,y,z);
 mesh.castShadow=shadow;
 mesh.receiveShadow=true;
 scene.add(mesh);
 return mesh;
}

// Long shopping hall
const floor=new THREE.Mesh(new THREE.PlaneGeometry(24,100),floorMat);
floor.rotation.x=-Math.PI/2;
floor.position.set(0,0,-39);
floor.receiveShadow=true;
scene.add(floor);

box(24,.22,100,0,7,-39,material('#e9edf5'),false);
box(.35,7,100,-12,3.5,-39,wallMat);
box(.35,7,100,12,3.5,-39,wallMat);
box(24,7,.35,0,3.5,-89,wallMat);
box(24,7,.35,0,3.5,11,wallMat);

// Floor tiles
const grout=material('#c1c9d7',.8);
for(let x=-11;x<=11;x+=2){
 box(.025,.008,98,x,.009,-39,grout,false);
}
for(let z=9;z>=-87;z-=2){
 box(23,.008,.025,0,.01,z,grout,false);
}

// Shop signs
function sign(text,x,y,z,w=5){
 const canvas=document.createElement('canvas');
 canvas.width=768;canvas.height=180;
 const c=canvas.getContext('2d');
 c.fillStyle='#17263f';c.fillRect(0,0,768,180);
 c.fillStyle='#ffd166';c.font='bold 62px Arial';
 c.textAlign='center';c.textBaseline='middle';
 c.fillText(text,384,90);
 const tex=new THREE.CanvasTexture(canvas);
 const mesh=new THREE.Mesh(new THREE.PlaneGeometry(w,1.1),
  new THREE.MeshBasicMaterial({map:tex}));
 mesh.position.set(x,y,z);scene.add(mesh);
}
sign('C&N SHOPPING HALL',0,5.8,10.78,10);

// Ceiling lights
for(let z=7;z>=-83;z-=9){
 box(4,.08,.65,-3,6.85,z,material('#ffffff',.2),false);
 const light=new THREE.PointLight(0xfff1d0,38,15,2);
 light.position.set(-3,6.4,z);
 scene.add(light);
 const light2=new THREE.PointLight(0xffffff,26,14,2);
 light2.position.set(3,6.2,z-3);
 scene.add(light2);
}

// Product data and online product photographs
const products=[
{id:1,name:'Fashion Shoes',cat:'Shoes',price:8500,color:'#d94b62',img:'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=650&auto=format&fit=crop'},
{id:2,name:'Wrist Watch',cat:'Accessories',price:12500,color:'#2681aa',img:'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=650&auto=format&fit=crop'},
{id:3,name:'Headphones',cat:'Electronics',price:9900,color:'#8557c8',img:'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=650&auto=format&fit=crop'},
{id:4,name:'Backpack',cat:'Bags',price:6500,color:'#218d6b',img:'https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=650&auto=format&fit=crop'},
{id:5,name:'Sunglasses',cat:'Fashion',price:4500,color:'#c47b30',img:'https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=650&auto=format&fit=crop'},
{id:6,name:'Camera',cat:'Electronics',price:42500,color:'#3e76bd',img:'https://images.unsplash.com/photo-1516035069371-29a1b244cc32?w=650&auto=format&fit=crop'},
{id:7,name:'Casual Shirt',cat:'Clothing',price:5200,color:'#c34b85',img:'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=650&auto=format&fit=crop'},
{id:8,name:'Perfume',cat:'Beauty',price:7800,color:'#9b70c9',img:'https://images.unsplash.com/photo-1541643600914-78b084683601?w=650&auto=format&fit=crop'},
{id:9,name:'Fresh Drinks',cat:'Drinks',price:650,color:'#4eaa70',img:'https://images.unsplash.com/photo-1544145945-f90425340c7e?w=650&auto=format&fit=crop'},
{id:10,name:'Shopping Snacks',cat:'Food',price:450,color:'#d59a3b',img:'https://images.unsplash.com/photo-1621939514649-280e2aa7f126?w=650&auto=format&fit=crop'},
{id:11,name:'Sports Shoes',cat:'Sports',price:10500,color:'#5482c2',img:'https://images.unsplash.com/photo-1460353581641-37baddab0fa2?w=650&auto=format&fit=crop'},
{id:12,name:'Handbag',cat:'Fashion',price:9200,color:'#b17b5a',img:'https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=650&auto=format&fit=crop'}
];

const textureLoader=new THREE.TextureLoader();
textureLoader.setCrossOrigin('anonymous');
const clickable=[];
const productMeshes=[];

function addPhoto(p,parent,x,y,z,w,h){
 const mat=new THREE.MeshStandardMaterial({color:p.color,roughness:.6});
 const photo=new THREE.Mesh(new THREE.PlaneGeometry(w,h),mat);
 photo.position.set(x,y,z);
 parent.add(photo);
 textureLoader.load(p.img,tex=>{
  tex.colorSpace=THREE.SRGBColorSpace;
  photo.material=new THREE.MeshBasicMaterial({map:tex});
 },undefined,()=>{});
 photo.userData.product=p;
 clickable.push(photo);
 return photo;
}

function makeLabel(p,parent,x,y,z){
 const canvas=document.createElement('canvas');
 canvas.width=512;canvas.height=110;
 const c=canvas.getContext('2d');
 c.fillStyle='#fff';c.fillRect(0,0,512,110);
 c.fillStyle='#15233b';c.font='bold 30px Arial';
 c.textAlign='center';
 c.fillText(p.name,256,36);
 c.fillStyle='#087f5b';c.font='bold 31px Arial';
 c.fillText('Rs. '+p.price.toLocaleString('en-US'),256,82);
 const tex=new THREE.CanvasTexture(canvas);
 const mesh=new THREE.Mesh(new THREE.PlaneGeometry(1.55,.34),
  new THREE.MeshBasicMaterial({map:tex}));
 mesh.position.set(x,y,z);parent.add(mesh);
}

// Multiple long rows of racks, with merchandise on each shelf
function makeRack(x,z,p,side){
 const group=new THREE.Group();
 group.position.set(x,0,z);
 scene.add(group);
 const width=3.35,depth=1.15;
 box(width,.17,depth,x, .45,z,shelfMat);
 box(width,.12,depth,x,1.45,z,shelfMat);
 box(width,.12,depth,x,2.35,z,shelfMat);
 box(.12,2.65,depth,x-width/2,.1+1.25,z,goldMat);
 box(.12,2.65,depth,x+width/2,.1+1.25,z,goldMat);
 box(width,.1,depth,x,3.02,z,shelfMat);

 const faceZ=z+(side==='left'?.60:-.60);
 const baseP=p;
 for(let level=0;level<3;level++){
  addPhoto(baseP,group,0,.88+level*.88,side==='left'?.59:-.59,1.05,.62);
  // Small merchandise packages beside the featured product
  for(let j=0;j<3;j++){
   const colors=[p.color,'#e6bd61','#6bb3a5','#d8757c','#7791cf'];
   const pkg=box(.22,.35,.23,
    x-1.05+j*.65,.72+level*.88,z+(side==='left'?.35:-.35),
    material(colors[(j+level)%colors.length]),false);
   pkg.userData.product=p;
   clickable.push(pkg);
  }
  makeLabel(p,group,0,.54+level*.88,side==='left'?.605:-.605);
 }
}

// Long aisles, separated by wide walking paths
for(let row=0;row<4;row++){
 const zStart=5-row*9;
 for(let n=0;n<5;n++){
  const z=zStart-n*9;
  if(z < -83)continue;
  const leftP=products[(row*2+n)%products.length];
  const rightP=products[(row*2+n+4)%products.length];
  makeRack(-8.2,z,leftP,'left');
  makeRack(8.2,z,rightP,'right');
 }
}

// Central promotional display tables
function makeTable(x,z,p){
 box(2.2,.3,1.5,x,.7,z,material('#a86d49'));
 box(2.35,.12,1.65,x,.91,z,goldMat);
 for(let i=0;i<3;i++){
  const offset=(i-1)*.65;
  const obj=box(.42,.65,.42,x+offset,1.28,z,material(p.color));
  obj.userData.product=p;clickable.push(obj);
 }
 addPhoto(p,scene,x,2.0,z+.02,1.7,.8);
 const marker=scene.children[scene.children.length-1];
 marker.userData.product=p;
 clickable.push(marker);
}
for(let i=0;i<7;i++){
 makeTable(0,2-i*12,products[(i+2)%products.length]);
}

// Plants at selected corners
function makePlant(x,z){
 const pot=new THREE.Mesh(new THREE.CylinderGeometry(.34,.25,.55,14),material('#a96845'));
 pot.position.set(x,.28,z);scene.add(pot);
 for(let i=0;i<6;i++){
  const leaf=new THREE.Mesh(new THREE.SphereGeometry(.22,10,8),
   material(i%2?'#278657':'#45a56b'));
  leaf.scale.set(.7,2,.7);
  leaf.position.set(x+Math.sin(i)*.23,.8+(i%3)*.2,z+Math.cos(i)*.2);
  scene.add(leaf);
 }
}
makePlant(-10,8);makePlant(10,8);
makePlant(-10,-85);makePlant(10,-85);

// Player character: head, body, arms and legs
const player=new THREE.Group();
scene.add(player);
const skin=material('#d7a27e');
const shirt=material('#2677c8');
const pants=material('#25334b');
const shoes=material('#f4f4f4');
const hair=material('#30231e');

function part(parent,w,h,d,x,y,z,mat,round=false){
 const mesh=new THREE.Mesh(
  round?new THREE.SphereGeometry(w/2,16,12):new THREE.BoxGeometry(w,h,d),mat
 );
 mesh.position.set(x,y,z);
 mesh.castShadow=true;
 parent.add(mesh);
 return mesh;
}
part(player,.55,.78,.32,0,1.12,0,shirt);
part(player,.43,.45,.4,0,1.78,0,skin,true);
part(player,.46,.18,.42,0,2.0,0,hair,true);
part(player,.12,.52,.13,-.38,1.15,0,skin);
part(player,.12,.52,.13,.38,1.15,0,skin);
const legL=part(player,.19,.65,.22,-.15,.43,0,pants);
const legR=part(player,.19,.65,.22,.15,.43,0,pants);
const footL=part(player,.22,.15,.36,-.15,.12,-.07,shoes);
const footR=part(player,.22,.15,.36,.15,.12,-.07,shoes);
player.position.set(0,0,8);

// Camera follows behind the player
let yaw=0;
let pitch=.08;
function updateCamera(){
 const distance=5.7;
 const target=new THREE.Vector3(
  player.position.x+Math.sin(yaw)*distance,
  player.position.y+3.1+pitch*2,
  player.position.z+Math.cos(yaw)*distance
 );
 camera.position.lerp(target,.18);
 const look=new THREE.Vector3(
  player.position.x,
  player.position.y+1.3,
  player.position.z- Math.cos(yaw)*2
 );
 camera.lookAt(look);
}

const keys={};
const moving={f:false,b:false,l:false,r:false};
addEventListener('keydown',e=>{
 keys[e.code]=true;
 if(e.code.startsWith('Arrow'))e.preventDefault();
});
addEventListener('keyup',e=>keys[e.code]=false);

document.querySelectorAll('[data-m]').forEach(btn=>{
 const k=btn.dataset.m;
 const down=e=>{e.preventDefault();moving[k]=true};
 const up=e=>{e.preventDefault();moving[k]=false};
 btn.addEventListener('pointerdown',down);
 btn.addEventListener('pointerup',up);
 btn.addEventListener('pointercancel',up);
 btn.addEventListener('pointerleave',up);
});

// Drag on the right side to rotate camera around the character
let dragX=null,dragY=null;
renderer.domElement.addEventListener('pointerdown',e=>{
 if(e.clientX>innerWidth*.38){
  dragX=e.clientX;dragY=e.clientY;
 }
});
renderer.domElement.addEventListener('pointermove',e=>{
 if(dragX!==null){
  yaw+=(e.clientX-dragX)*.006;
  pitch=THREE.MathUtils.clamp(pitch+(e.clientY-dragY)*.002,-.4,.5);
  dragX=e.clientX;dragY=e.clientY;
 }
});
renderer.domElement.addEventListener('pointerup',()=>{
 dragX=null;dragY=null;
});
renderer.domElement.addEventListener('pointercancel',()=>{
 dragX=null;dragY=null;
});

// Product selection
const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();
const cart=[];
function openProduct(p){
 document.getElementById('content').innerHTML=`
  <img src="${p.img}" alt="${p.name}">
  <h2>${p.name}</h2>
  <p>Category: ${p.cat}</p>
  <h2 style="color:#087f5b">Rs. ${p.price.toLocaleString('en-US')}</h2>
  <button class="wide" id="add">🛒 Cart එකට දාන්න</button>`;
 document.getElementById('panel').style.display='block';
 document.getElementById('add').onclick=()=>{
  cart.push(p);updateCart();
  document.getElementById('hint').textContent='✅ Cart එකට එකතු කළා!';
 };
}
renderer.domElement.addEventListener('click',e=>{
 if(e.clientX<innerWidth*.38)return;
 pointer.x=e.clientX/innerWidth*2-1;
 pointer.y=-(e.clientY/innerHeight)*2+1;
 raycaster.setFromCamera(pointer,camera);
 const hits=raycaster.intersectObjects(clickable,false);
 if(hits.length){
  const p=hits[0].object.userData.product;
  if(p)openProduct(p);
 }
});

function updateCart(){
 document.getElementById('count').textContent=cart.length;
}
function openCart(){
 const total=cart.reduce((sum,p)=>sum+p.price,0);
 const list=cart.map((p,i)=>`<li>${p.name} — Rs. ${p.price.toLocaleString('en-US')}</li>`).join('');
 document.getElementById('content').innerHTML=`
  <h2>🛒 මගේ Cart එක</h2>
  ${cart.length?'<ol>'+list+'</ol>':'<p>Cart එක තවම හිස්.</p>'}
  <h2>මුළු මුදල: Rs. ${total.toLocaleString('en-US')}</h2>
  ${cart.length?'<button class="wide" id="order">WhatsApp Order කරන්න</button>':''}
  <button class="wide" id="clear">Cart එක හිස් කරන්න</button>`;
 document.getElementById('panel').style.display='block';
 const order=document.getElementById('order');
 if(order)order.onclick=()=>{
  const lines=cart.map((p,i)=>`${i+1}. ${p.name} - Rs. ${p.price}`).join('\n');
  const msg=`C&N SHOPPING HALL Order\n${lines}\nTotal: Rs. ${total}`;
  window.open('https://wa.me/94767054639?text='+encodeURIComponent(msg),'_blank');
 };
 document.getElementById('clear').onclick=()=>{
  cart.length=0;updateCart();openCart();
 };
}
document.getElementById('cartButton').onclick=openCart;
document.getElementById('close').onclick=()=>{
 document.getElementById('panel').style.display='none';
};
document.getElementById('resetButton').onclick=()=>{
 player.position.set(0,0,8);yaw=0;pitch=.08;
 document.getElementById('panel').style.display='none';
 document.getElementById('hint').textContent='🏬 ආරම්භක ස්ථානයට ආවා!';
};

// Game loop
const clock=new THREE.Clock();
let walkTime=0;
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 let forward=0,side=0;
 if(keys.ArrowUp||keys.KeyW||moving.f)forward+=1;
 if(keys.ArrowDown||keys.KeyS||moving.b)forward-=1;
 if(keys.ArrowLeft||keys.KeyA||moving.l)side-=1;
 if(keys.ArrowRight||keys.KeyD||moving.r)side+=1;

 const len=Math.hypot(forward,side);
 if(len>0){
  forward/=len;side/=len;
  const speed=4.0*dt;
  const angle=yaw;
  player.position.x+=(-Math.sin(angle)*forward+Math.cos(angle)*side)*speed;
  player.position.z+=(-Math.cos(angle)*forward-Math.sin(angle)*side)*speed;
  player.rotation.y=Math.atan2(-side,forward)-yaw;
  walkTime+=dt*10;
  legL.rotation.x=Math.sin(walkTime)*.45;
  legR.rotation.x=-Math.sin(walkTime)*.45;
  footL.rotation.x=legL.rotation.x;
  footR.rotation.x=legR.rotation.x;
 }else{
  legL.rotation.x*=.8;legR.rotation.x*=.8;
  footL.rotation.x*=.8;footR.rotation.x*=.8;
 }
 player.position.x=THREE.MathUtils.clamp(player.position.x,-10.2,10.2);
 player.position.z=THREE.MathUtils.clamp(player.position.z,-87,9);
 updateCamera();
 renderer.render(scene,camera);
}
updateCamera();
animate();

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
