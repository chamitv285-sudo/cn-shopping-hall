
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>C&N SHOPPING HALL 3D</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#aebbc5;font-family:Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block}
#brand{position:fixed;top:12px;left:12px;color:white;background:#102332e8;border:1px solid #ffffff38;border-radius:10px;padding:11px 15px;pointer-events:none}
#brand strong{letter-spacing:1px;font-size:16px}
#brand small{display:block;color:#c6d5df;margin-top:5px;font-size:10px}
#help{position:fixed;top:12px;right:12px;padding:10px 12px;background:#102332d9;color:white;border-radius:9px;font-size:12px;line-height:1.7;pointer-events:none}
#status{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);padding:8px 13px;border-radius:20px;background:#102332e8;color:white;font-size:12px;white-space:nowrap}
#loading{position:fixed;inset:0;z-index:9;background:#15232d;display:flex;align-items:center;justify-content:center;color:white;text-align:center;padding:24px}
#loading h1{font-size:25px;letter-spacing:2px}
#loading p{color:#d5e0e7;line-height:1.7}
#pad{position:fixed;bottom:25px;left:18px;display:grid;grid-template-columns:50px 50px 50px;grid-template-rows:50px 50px;gap:5px}
.ctrl{border:1px solid #ffffff70;border-radius:13px;background:#142a3be0;color:white;font-size:22px;touch-action:none;user-select:none;-webkit-user-select:none}
#up{grid-column:2;grid-row:1}#left{grid-column:1;grid-row:2}#down{grid-column:2;grid-row:2}#right{grid-column:3;grid-row:2}
#look{display:none;position:fixed;right:15px;bottom:30px;width:115px;height:115px;border:1px solid #ffffff75;border-radius:50%;background:#10233238;color:white;align-items:center;justify-content:center;font-size:11px;touch-action:none}
@media(pointer:coarse){#look{display:flex}#help{max-width:155px;font-size:10px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="brand"><strong>C&N SHOPPING HALL</strong><small>3D SUPERMARKET EXPERIENCE</small></div>
<div id="help">W A S D / Arrow keys: Move<br>Mouse drag: Look around<br>Mobile: Buttons + drag</div>
<div id="status">Loading supermarket...</div>
<div id="loading"><div><h1>C&N SHOPPING HALL</h1><p>Loading the 3D supermarket and character.<br>Please wait while the models load.</p></div></div>
<div id="pad">
<button class="ctrl" id="up" aria-label="Move forward">▲</button>
<button class="ctrl" id="left" aria-label="Move left">◀</button>
<button class="ctrl" id="down" aria-label="Move backward">▼</button>
<button class="ctrl" id="right" aria-label="Move right">▶</button>
</div>
<div id="look">DRAG TO LOOK</div>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
 }
}
</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

const game=document.querySelector('#game');
const status=document.querySelector('#status');
const loading=document.querySelector('#loading');

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xb7c5ce);
scene.fog=new THREE.Fog(0xb7c5ce,48,105);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,180);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
game.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xeaf4ff,0x635747,2.0));

const sun=new THREE.DirectionalLight(0xfff0d9,2.7);
sun.position.set(-15,24,12);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-36;
sun.shadow.camera.right=36;
sun.shadow.camera.top=40;
sun.shadow.camera.bottom=-40;
scene.add(sun);

function material(color,roughness=.6,metalness=0){
 return new THREE.MeshStandardMaterial({color,roughness,metalness});
}
const concrete=material(0x858d92,.35,.12);
const wall=material(0xd9dfe1,.85);
const metal=material(0x8c9aa2,.3,.82);
const frame=material(0x46545d,.38,.72);
const shelfSurface=material(0xc3cbd0,.4,.58);
const dark=material(0x24333b,.48,.4);
const white=material(0xf1f3f4,.3,.15);
const gold=material(0xe2b654,.36,.35);

function addBox(w,h,d,mat,x,y,z,shadow=true){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
 m.position.set(x,y,z);
 m.castShadow=shadow;
 m.receiveShadow=true;
 scene.add(m);
 return m;
}

// Large tiled floor
addBox(64,.2,86,concrete,0,-.18,-9,false);
const grout=material(0xaeb4b7,.8);
for(let x=-31;x<=31;x+=2){
 addBox(.018,.008,84,grout,x,-.075,-9,false);
}
for(let z=-51;z<=33;z+=2){
 addBox(64,.008,.018,grout,0,-.073,z,false);
}

// Store walls and roof beams
addBox(64,8,.5,wall,0,4,-52,false);
addBox(.5,8,86,wall,-32,4,-9,false);
addBox(.5,8,86,wall,32,4,-9,false);
for(let x=-28;x<=28;x+=7){
 addBox(.15,.18,84,frame,x,7.4,-9,false);
}
for(let z=-45;z<=25;z+=14){
 addBox(63,.12,.2,frame,0,7.15,z,false);
}

// Main store sign
addBox(19,1.7,.16,dark,0,6.1,-51.7,false);
function makeText(text,width,height,color){
 const c=document.createElement('canvas');
 c.width=1024;c.height=256;
 const ctx=c.getContext('2d');
 ctx.clearRect(0,0,c.width,c.height);
 ctx.fillStyle=color;
 ctx.font='bold 88px Arial';
 ctx.textAlign='center';
 ctx.textBaseline='middle';
 ctx.fillText(text,512,128);
 const tex=new THREE.CanvasTexture(c);
 tex.colorSpace=THREE.SRGBColorSpace;
 const m=new THREE.Mesh(
  new THREE.PlaneGeometry(width,height),
  new THREE.MeshBasicMaterial({map:tex,transparent:true,side:THREE.DoubleSide})
 );
 return m;
}
const sign=makeText('C&N SHOPPING HALL',17,1.65,'#ffffff');
sign.position.set(0,6.1,-51.59);
scene.add(sign);

// Realistic-looking metal shelving with empty shelves
function createRack(cx,cz,length=22){
 const rack=new THREE.Group();
 rack.position.set(cx,0,cz);
 scene.add(rack);
 const w=2.3,h=3.25;
 const levels=[.38,1.02,1.66,2.30,2.94];

 // Tall metal posts
 for(const x of [-w/2,w/2]){
  for(const z of [-length/2,length/2]){
   const p=new THREE.Mesh(new THREE.BoxGeometry(.075,h,.075),metal);
   p.position.set(x,h/2,z);
   p.castShadow=true;
   rack.add(p);
  }
  // Long structural rails
  for(const y of [.35,.98,1.61,2.24,2.87]){
   const rail=new THREE.Mesh(new THREE.BoxGeometry(.045,.045,length),frame);
   rail.position.set(x,y,0);
   rack.add(rail);
  }
 }

 // Shelf decks
 for(const y of levels){
  const deck=new THREE.Mesh(new THREE.BoxGeometry(w,.075,length),shelfSurface);
  deck.position.set(0,y,0);
  deck.castShadow=true;
  deck.receiveShadow=true;
  rack.add(deck);

  // Front and back lips
  for(const z of [-length/2,length/2]){
   const lip=new THREE.Mesh(new THREE.BoxGeometry(w,.09,.045),metal);
   lip.position.set(0,y+.045,z);
   rack.add(lip);
  }
 }

 // Back panels and perforation details
 for(let z=-length/2+.5;z<length/2;z+=.65){
  const panel=new THREE.Mesh(new THREE.BoxGeometry(w-.08,.5,.025),frame);
  panel.position.set(0,1.8,z);
  rack.add(panel);
  for(let y=1.61;y<=2.03;y+=.14){
   const hole=new THREE.Mesh(new THREE.BoxGeometry(w-.22,.012,.03),metal);
   hole.position.set(0,y,z+.018);
   rack.add(hole);
  }
 }

 // Diagonal side braces
 for(const z of [-length/2+.2,length/2-.2]){
  for(const x of [-w/2,w/2]){
   const brace=new THREE.Mesh(new THREE.BoxGeometry(.045,2.6,.045),metal);
   brace.position.set(x,1.6,z);
   brace.rotation.z=x<0?-.12:.12;
   rack.add(brace);
  }
 }
 return rack;
}

// Six long rack rows with wide walkways
[-22,-15,-8,8,15,22].forEach(x=>createRack(x,-15,25));

// Short cross-aisle shelving at the rear
createRack(-11.5,-.8,2.4);
createRack(11.5,-.8,2.4);

// Entrance counter
addBox(11,.85,1.2,dark,0,.43,20);
addBox(11,.12,1.3,white,0,.92,20);
addBox(11,.045,.06,gold,0,.99,19.35,false);

// Overhead LED light fixtures
const lampMaterial=new THREE.MeshStandardMaterial({
 color:0xffffff,emissive:0xffffff,emissiveIntensity:1.2,roughness:.3
});
for(let x=-25;x<=25;x+=10){
 for(let z=-43;z<=20;z+=12){
  addBox(3.2,.12,.72,frame,x,6.85,z,false);
  addBox(2.9,.045,.52,lampMaterial,x,6.77,z,false);
  const light=new THREE.PointLight(0xfff2df,36,17,2);
  light.position.set(x,6.55,z);
  scene.add(light);
 }
}

// Entrance pillars
for(const x of [-9,9]){
 addBox(.35,4,.35,metal,x,2,24);
 addBox(1.2,.18,.8,white,x,4.08,24);
}

// Character holder
const player=new THREE.Group();
scene.add(player);
player.position.set(0,0,28);

let mixer=null;
let idleAction=null;
let walkAction=null;
let activeAction=null;
let characterReady=false;

function playAction(action){
 if(!action||activeAction===action)return;
 action.reset().fadeIn(.2).play();
 if(activeAction)activeAction.fadeOut(.2);
 activeAction=action;
}

const loader=new GLTFLoader();
loader.load(
 'https://threejs.org/examples/models/gltf/Soldier.glb',
 gltf=>{
  const model=gltf.scene;
  model.scale.setScalar(1.05);
  model.traverse(o=>{
   if(o.isMesh){
    o.castShadow=true;
    o.receiveShadow=true;
   }
  });
  player.add(model);

  mixer=new THREE.AnimationMixer(model);
  for(const clip of gltf.animations){
   const action=mixer.clipAction(clip);
   if(clip.name.toLowerCase().includes('walk'))walkAction=action;
   if(clip.name.toLowerCase().includes('idle'))idleAction=action;
  }
  if(!idleAction&&gltf.animations.length)idleAction=mixer.clipAction(gltf.animations[0]);
  playAction(idleAction);
  characterReady=true;
  loading.style.display='none';
  status.textContent='Ready — use the controls to walk';
 },
 undefined,
 error=>{
  console.error('Character model failed to load:',error);
  loading.querySelector('p').textContent=
   'The 3D character could not load. Check your internet connection and reload.';
  status.textContent='Character model failed to load';
 }
);

// Camera orientation
let yaw=0;
let pitch=.18;
let dragging=false;
let lastX=0,lastY=0;

renderer.domElement.addEventListener('pointerdown',e=>{
 dragging=true;
 lastX=e.clientX;
 lastY=e.clientY;
 renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener('pointermove',e=>{
 if(!dragging)return;
 yaw-=(e.clientX-lastX)*.005;
 pitch=THREE.MathUtils.clamp(pitch-(e.clientY-lastY)*.004,-.15,.75);
 lastX=e.clientX;
 lastY=e.clientY;
});
function endDrag(){dragging=false}
renderer.domElement.addEventListener('pointerup',endDrag);
renderer.domElement.addEventListener('pointercancel',endDrag);

// Keyboard controls
const keys=Object.create(null);
addEventListener('keydown',e=>{
 const k=e.key.toLowerCase();
 keys[k]=true;
 if(k.startsWith('arrow'))e.preventDefault();
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
addEventListener('blur',()=>Object.keys(keys).forEach(k=>keys[k]=false));

// Touch movement buttons
const buttonKeys={up:'w',down:'s',left:'a',right:'d'};
for(const [id,key] of Object.entries(buttonKeys)){
 const b=document.getElementById(id);
 b.addEventListener('pointerdown',e=>{
  e.preventDefault();
  keys[key]=true;
  b.setPointerCapture(e.pointerId);
 });
 const release=()=>keys[key]=false;
 b.addEventListener('pointerup',release);
 b.addEventListener('pointercancel',release);
 b.addEventListener('lostpointercapture',release);
}

// Dedicated mobile look pad
const look=document.getElementById('look');
let looking=false,lookX=0,lookY=0;
look.addEventListener('pointerdown',e=>{
 looking=true;
 lookX=e.clientX;
 lookY=e.clientY;
 look.setPointerCapture(e.pointerId);
});
look.addEventListener('pointermove',e=>{
 if(!looking)return;
 yaw-=(e.clientX-lookX)*.008;
 pitch=THREE.MathUtils.clamp(pitch-(e.clientY-lookY)*.006,-.15,.75);
 lookX=e.clientX;
 lookY=e.clientY;
});
look.addEventListener('pointerup',()=>looking=false);
look.addEventListener('pointercancel',()=>looking=false);

// Movement and third-person camera
const clock=new THREE.Clock();
const move=new THREE.Vector3();
const forward=new THREE.Vector3();
const side=new THREE.Vector3();
const target=new THREE.Vector3();

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.05);
 if(mixer)mixer.update(dt);

 const forwardPressed=keys.w||keys.arrowup;
 const backPressed=keys.s||keys.arrowdown;
 const leftPressed=keys.a||keys.arrowleft;
 const rightPressed=keys.d||keys.arrowright;

 move.set(0,0,0);
 forward.set(-Math.sin(yaw),0,-Math.cos(yaw));
 side.set(Math.cos(yaw),0,-Math.sin(yaw));

 if(forwardPressed)move.add(forward);
 if(backPressed)move.sub(forward);
 if(rightPressed)move.add(side);
 if(leftPressed)move.sub(side);

 const moving=move.lengthSq()>0;

 if(moving){
  move.normalize();
  player.position.addScaledVector(move,4*dt);
  player.rotation.y=Math.atan2(move.x,move.z);
  player.position.x=THREE.MathUtils.clamp(player.position.x,-29,29);
  player.position.z=THREE.MathUtils.clamp(player.position.z,-49,31);
  playAction(walkAction||idleAction);
 }else{
  playAction(idleAction);
 }

 target.set(player.position.x,1.45,player.position.z);
 const distance=6.5;
 camera.position.set(
  player.position.x+Math.sin(yaw)*distance,
  player.position.y+2.8+pitch*3,
  player.position.z+Math.cos(yaw)*distance
 );
 camera.lookAt(target);
 renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));
});
</script>
</body>
</html>
