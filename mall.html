
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C&N Shopping Hall 3D Mall</title>
<style>
body{margin:0;overflow:hidden;font-family:Arial;background:#101820;color:white}
#hud{position:fixed;top:12px;left:12px;z-index:2;background:#101820dd;padding:14px;border-radius:12px}
#hud h2{margin:0 0 8px;color:#e8bd58}
#help{font-size:13px;line-height:1.7}
#status{color:#e8bd58}
canvas{display:block}
</style>
</head>
<body>
<div id="hud">
<h2>C&N SHOPPING HALL</h2>
<div>3D Shopping Mall</div>
<div id="help">Move: W A S D / Arrow keys<br>Look: Mouse (click the mall)<br>Explore the shelves!</div>
<p id="status">Welcome to the Mall!</p>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9eb8c7);
scene.fog = new THREE.Fog(0x9eb8c7, 25, 75);

const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(0, 2, 9);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x46505a, 2));
const light = new THREE.DirectionalLight(0xffffff, 2);
light.position.set(0, 12, 5);
light.castShadow = true;
scene.add(light);

function box(w,h,d,x,y,z,color){
 const mesh = new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  new THREE.MeshStandardMaterial({color})
 );
 mesh.position.set(x,y,z);
 mesh.castShadow = true;
 mesh.receiveShadow = true;
 scene.add(mesh);
 return mesh;
}

box(28,0.4,38,0,-0.3,0,0xd6d1c5);
box(28,0.5,0.5,0,5,-19,0x343f49);
box(28,0.5,0.5,0,5,19,0x343f49);
box(0.5,5,38,-14,2.2,0,0x64717a);
box(0.5,5,38,14,2.2,0,0x64717a);
box(28,0.4,38,0,5.1,0,0xf0e6cf);

for(let x=-10;x<=10;x+=5){
 box(0.25,0.25,35,x,4.7,0,0xe8bd58);
}

const colors=[0xd65b49,0x3b91cf,0xe8bd58,0x54a66c,0x9c6bd1];
for(let row=-1;row<=1;row++){
 const z=row*7;
 for(let x=-9;x<=9;x+=6){
  box(3.2,3.1,1.2,x,1.55,z,0x76563b);
  for(let y of [0.65,1.5,2.35]){
   box(3.35,0.12,1.4,x,y,z,0xc8a77b);
   for(let i=0;i<4;i++){
    const c=colors[(i+Math.abs(x)+Math.abs(row))%colors.length];
    box(0.45,0.48,0.45,x-1.1+i*0.72,y+0.3,z,c);
   }
  }
 }
}

box(4,1.1,1.5,0,0.55,-15,0x263f4b);
box(3.6,0.15,1.3,0,1.2,-15,0xe8bd58);

const keys={};
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

let yaw=0, pitch=0, locked=false;
renderer.domElement.addEventListener('click',()=>{
 renderer.domElement.requestPointerLock?.();
});
document.addEventListener('pointerlockchange',()=>{
 locked=document.pointerLockElement===renderer.domElement;
});
document.addEventListener('mousemove',e=>{
 if(!locked)return;
 yaw-=e.movementX*0.002;
 pitch-=e.movementY*0.002;
 pitch=Math.max(-1,Math.min(1,pitch));
});

function animate(){
 requestAnimationFrame(animate);
 const speed=0.12;
 const forward=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0);
 const side=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);
 camera.position.x+=(-Math.sin(yaw)*forward+Math.cos(yaw)*side)*speed;
 camera.position.z+=(-Math.cos(yaw)*forward-Math.sin(yaw)*side)*speed;
 camera.position.x=Math.max(-12,Math.min(12,camera.position.x));
 camera.position.z=Math.max(-17,Math.min(17,camera.position.z));
 camera.position.y=2;
 camera.rotation.order='YXZ';
 camera.rotation.y=yaw;
 camera.rotation.x=pitch;
 document.getElementById('status').textContent=
 'Explore the Mall | Position: '+camera.position.x.toFixed(1)+', '+camera.position.z.toFixed(1);
 renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
