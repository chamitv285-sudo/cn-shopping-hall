<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>C&N SHOPPING HALL 3D</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#bbc5c8;font-family:Arial,sans-serif}
canvas{display:block;touch-action:none}
#title{position:fixed;top:14px;left:14px;z-index:5;color:white;background:#172a30e8;padding:12px 16px;border-radius:9px;font-weight:bold;letter-spacing:1px;pointer-events:none}
#help{position:fixed;top:70px;left:14px;z-index:5;color:white;background:#172a30d9;padding:10px 12px;border-radius:8px;font-size:12px;line-height:1.7;pointer-events:none}
#status{position:fixed;top:14px;right:14px;background:#172a30e8;color:white;padding:10px;border-radius:8px;font-size:12px;z-index:5}
#reset{position:fixed;right:14px;top:60px;z-index:5;padding:10px 12px;border:0;border-radius:8px;background:#e7e9e5;color:#172a30}
#pad{display:none;position:fixed;bottom:16px;left:12px;z-index:5;grid-template-columns:48px 48px 48px;gap:5px}
#pad button{height:46px;border:1px solid #ffffff66;border-radius:10px;background:#172a30dc;color:white;font-size:20px;touch-action:none}
#pad .up{grid-column:2}
#pad .left{grid-column:1}
#pad .down{grid-column:2}
#pad .right{grid-column:3}
@media(pointer:coarse){#pad{display:grid}#help{max-width:210px;font-size:11px}}
</style>
</head>
<body>
<div id="title">C&N SHOPPING HALL</div>
<div id="help">
W / S — ඉදිරියට සහ පසුපසට<br>
A / D — දෙපැත්තට ඇවිදින්න<br>
Mouse drag — වටපිට බලන්න<br>
Shift — වේගයෙන් ඇවිදින්න
</div>
<div id="status">3D SUPERMARKET</div>
<button id="reset">මුලට යන්න</button>
<div id="pad">
<button class="up" data-key="KeyW">▲</button>
<button class="left" data-key="KeyA">◀</button>
<button class="down" data-key="KeyS">▼</button>
<button class="right" data-key="KeyD">▶</button>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

import {GLTFLoader} from
'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbac8cc);
scene.fog = new THREE.Fog(0xbac8cc, 40, 100);

const camera = new THREE.PerspectiveCamera(
 65, innerWidth/innerHeight, 0.1, 150
);

const renderer = new THREE.WebGLRenderer({
 antialias:true,
 powerPreference:'high-performance'
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
document.body.appendChild(renderer.domElement);

const mat=(color,roughness=0.7,metalness=0)=>
 new THREE.MeshStandardMaterial({color,roughness,metalness});

const concrete=mat(0xd0d4d1,0.3,0.08);
const wallmat=mat(0xe5e8e4,0.8);
const ceilingmat=mat(0xf0f1ed,0.8);
const steel=mat(0x68767b,0.32,0.78);
const steelDark=mat(0x39474c,0.4,0.72);
const shelfmat=mat(0xaeb8b9,0.4,0.55);
const trim=mat(0xf2f1e9,0.4,0.1);

function box(parent,w,h,d,x,y,z,material,shadows=true){
 const mesh=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),material
 );
 mesh.position.set(x,y,z);
 mesh.castShadow=shadows;
 mesh.receiveShadow=true;
 parent.add(mesh);
 return mesh;
}

scene.add(new THREE.HemisphereLight(0xf1f7ff,0x7b8581,2));

const sunlight=new THREE.DirectionalLight(0xfff4df,2.3);
sunlight.position.set(-10,18,10);
sunlight.castShadow=true;
sunlight.shadow.mapSize.set(1024,1024);
sunlight.shadow.camera.left=-25;
sunlight.shadow.camera.right=25;
sunlight.shadow.camera.top=30;
sunlight.shadow.camera.bottom=-30;
scene.add(sunlight);

// SUPERMARKET FLOOR
box(scene,40,0.3,90,0,-0.17,-31,concrete,false);

// Large tiles
const grout=mat(0xaab3b2,0.85);
for(let x=-19;x<=19;x+=2){
 box(scene,0.018,0.006,88,x,0.001,-31,grout,false);
}
for(let z=13;z>=-75;z-=2){
 box(scene,39,0.006,0.018,0,0.002,z,grout,false);
}

// WALLS
box(scene,40,8,0.3,0,4,-76,wallmat);
box(scene,0.3,8,90,-20,4,-31,wallmat);
box(scene,0.3,8,90,20,4,-31,wallmat);

// CEILING
box(scene,40,0.35,90,0,7.4,-31,ceilingmat,false);

for(let z=12;z>=-72;z-=7){
 box(scene,39,0.13,0.18,0,7.15,z,trim,false);

 for(const x of [-14,-7,0,7,14]){
  box(scene,2.8,0.08,0.65,x,7.08,z-1,trim,false);

  const light=new THREE.PointLight(0xfff2db,28,13,2);
  light.position.set(x,6.6,z-1);
  scene.add(light);
 }
}

// METAL SHELVES
// Long, empty supermarket shelving with realistic metal supports.
function makeShelfRun(x,z1,z2){
 const group=new THREE.Group();
 scene.add(group);

 const length=Math.abs(z2-z1);
 const center=(z1+z2)/2;

 // central backbone
 box(group,0.12,3.5,length,x,1.8,center,steelDark);

 for(const side of [-1,1]){
  const faceX=x+side*0.56;

  // Metal vertical uprights
  for(const offset of [-0.98,0.98]){
   box(group,0.075,3.55,0.09,
       x+offset,1.8,z1,steel);
   box(group,0.075,3.55,0.09,
       x+offset,1.8,z2,steel);
  }

  // Empty steel shelves and front lips
  for(const y of [0.42,1.12,1.82,2.52,3.2]){
   box(group,1.95,0.075,length,
       faceX,y,center,shelfmat);

   box(group,1.95,0.065,length,
       faceX,y+0.055,center,steel);

   box(group,1.95,0.055,length,
       faceX,y-0.075,center,trim,false);

   // Small mounting brackets
   for(const z of [z1,z2]){
    box(group,0.11,0.11,0.13,
        faceX,y,z,steelDark);
   }
  }
 }

 // End frames
 for(const z of [z1,z2]){
  box(group,2,0.09,0.12,x,3.52,z,steelDark);
  box(group,2,0.09,0.12,x,0.25,z,steelDark);
 }
}

// Five long rows with clear walking aisles.
for(const x of [-12,-6,0,6,12]){
 makeShelfRun(x,12,-69);
}

// Entrance and rear architectural details
box(scene,16,0.15,0.2,0,4.2,14,steelDark,false);

for(const x of [-8,-4,0,4,8]){
 box(scene,0.09,3.8,0.1,x,1.9,14,steel,false);
}

// Store sign
function signTexture(){
 const canvas=document.createElement('canvas');
 canvas.width=1024;
 canvas.height=256;
 const ctx=canvas.getContext('2d');

 ctx.fillStyle='#234b4c';
 ctx.fillRect(0,0,1024,256);

 ctx.fillStyle='#e6c780';
 ctx.fillRect(0,0,1024,9);
 ctx.fillRect(0,247,1024,9);

 ctx.fillStyle='#fff9e9';
 ctx.font='bold 76px Arial';
 ctx.textAlign='center';
 ctx.textBaseline='middle';
 ctx.fillText('C&N SHOPPING HALL',512,130);

 const texture=new THREE.CanvasTexture(canvas);
 texture.colorSpace=THREE.SRGBColorSpace;
 return texture;
}

const sign=new THREE.Mesh(
 new THREE.PlaneGeometry(12,3),
 new THREE.MeshBasicMaterial({
  map:signTexture(),
  toneMapped:false
 })
);
sign.position.set(0,5.2,13.7);
scene.add(sign);

// HUMAN CHARACTER
// A procedural articulated human is used as a fallback.
// The model is not a photorealistic scanned human.

const player=new THREE.Group();
scene.add(player);
player.position.set(0,0,7);

const human=new THREE.Group();
player.add(human);

const skin=mat(0xc58e69,0.82);
const hair=mat(0x30241f,0.9);
const shirt=mat(0x347c83,0.78);
const pants=mat(0x26384b,0.8);
const shoes=mat(0x25292a,0.55);
const white=mat(0xf0e9dc,0.6);
const eye=mat(0x201b18,0.5);

function sphere(parent,x,y,z,sx,sy,sz,material){
 const mesh=new THREE.Mesh(
  new THREE.SphereGeometry(1,20,16),material
 );
 mesh.position.set(x,y,z);
 mesh.scale.set(sx,sy,sz);
 mesh.castShadow=true;
 mesh.receiveShadow=true;
 parent.add(mesh);
 return mesh;
}

function limb(parent,topRadius,bottomRadius,height,material){
 const mesh=new THREE.Mesh(
  new THREE.CylinderGeometry(
   topRadius,bottomRadius,height,16
  ),material
 );
 mesh.position.y=-height/2;
 mesh.castShadow=true;
 mesh.receiveShadow=true;
 parent.add(mesh);
 return mesh;
}

// torso
sphere(human,0,1.28,0,0.30,0.43,0.19,shirt);

// neck
sphere(human,0,1.77,0,0.09,0.13,0.09,skin);

// head
sphere(human,0,2.02,0,0.205,0.26,0.19,skin);

// hair cap and back hair
sphere(human,0,2.22,0.015,0.215,0.12,0.2,hair);
sphere(human,0,2.08,0.12,0.19,0.14,0.10,hair);

// ears
sphere(human,-0.207,2.03,0,0.04,0.065,0.045,skin);
sphere(human,0.207,2.03,0,0.04,0.065,0.045,skin);

// Eyes face toward the front (-Z)
for(const x of [-0.07,0.07]){
 sphere(human,x,2.06,-0.174,0.027,0.026,0.015,white);
 sphere(human,x,2.06,-0.188,0.012,0.016,0.008,eye);
}

// nose
sphere(human,0,2.01,-0.2,0.026,0.042,0.03,skin);

// arms
const arms=[];
for(const side of [-1,1]){
 const arm=new THREE.Group();
 arm.position.set(side*0.34,1.56,0);
 human.add(arm);
 arms.push(arm);

 limb(arm,0.105,0.085,0.36,shirt);

 const forearm=new THREE.Group();
 forearm.position.y=-0.36;
 arm.add(forearm);

 limb(forearm,0.075,0.055,0.34,skin);
 sphere(forearm,0,-0.36,-0.015,0.065,0.085,0.055,skin);
}

// legs
const legs=[];
for(const side of [-1,1]){
 const leg=new THREE.Group();
 leg.position.set(side*0.15,0.93,0);
 human.add(leg);
 legs.push(leg);

 limb(leg,0.13,0.095,0.43,pants);

 const lower=new THREE.Group();
 lower.position.y=-0.43;
 leg.add(lower);

 limb(lower,0.09,0.065,0.37,pants);

 // shoes point forward
 const foot=new THREE.Mesh(
  new THREE.BoxGeometry(0.19,0.12,0.31),shoes
 );
 foot.position.set(0,-0.38,-0.07);
 foot.castShadow=true;
 lower.add(foot);

 leg.userData.lower=lower;
}

// camera and controls
let yaw=0;
let pitch=-0.1;
let dragging=false;
let lastX=0;
let lastY=0;
const keys=new Set();

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

window.addEventListener('keydown',e=>{
 if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)){
  e.preventDefault();
 }
 keys.add(e.code);
});

window.addEventListener('keyup',e=>keys.delete(e.code));
window.addEventListener('blur',()=>keys.clear());

renderer.domElement.addEventListener('pointerdown',e=>{
 dragging=true;
 lastX=e.clientX;
 lastY=e.clientY;
 renderer.domElement.setPointerCapture(e.pointerId);
});

renderer.domElement.addEventListener('pointermove',e=>{
 if(!dragging)return;

 const dx=e.clientX-lastX;
 const dy=e.clientY-lastY;

 yaw-=dx*0.004;
 pitch=clamp(pitch-dy*0.003,-0.65,0.45);

 lastX=e.clientX;
 lastY=e.clientY;
});

renderer.domElement.addEventListener('pointerup',()=>dragging=false);
renderer.domElement.addEventListener('pointercancel',()=>dragging=false);

// Mobile movement buttons
document.querySelectorAll('[data-key]').forEach(button=>{
 const key=button.dataset.key;

 button.addEventListener('pointerdown',e=>{
  e.preventDefault();
  keys.add(key);
 });

 const stop=()=>{
  keys.delete(key);
 };

 button.addEventListener('pointerup',stop);
 button.addEventListener('pointercancel',stop);
 button.addEventListener('pointerleave',stop);
});

function cameraUpdate(){
 const target=new THREE.Vector3(
  player.position.x,
  player.position.y+1.55,
  player.position.z
 );

 const distance=4.3;
 const horizontal=Math.cos(pitch)*distance;

 camera.position.set(
  target.x+Math.sin(yaw)*horizontal,
  target.y+Math.sin(pitch)*distance,
  target.z+Math.cos(yaw)*horizontal
 );

 camera.lookAt(
  target.x-Math.sin(yaw)*2.5,
  target.y+Math.sin(pitch)*1.2,
  target.z-Math.cos(yaw)*2.5
 );
}

document.querySelector('#reset').addEventListener('click',()=>{
 player.position.set(0,0,7);
 yaw=0;
 pitch=-0.1;
});

const clock=new THREE.Clock();
let time=0;

function animate(){
 requestAnimationFrame(animate);

 const dt=Math.min(clock.getDelta(),0.04);
 time+=dt;

 let forward=0;
 let side=0;

 if(keys.has('KeyW')||keys.has('ArrowUp'))forward++;
 if(keys.has('KeyS')||keys.has('ArrowDown'))forward--;
 if(keys.has('KeyA')||keys.has('ArrowLeft'))side--;
 if(keys.has('KeyD')||keys.has('ArrowRight'))side++;

 const moving=forward!==0||side!==0;

 if(moving){
  const length=Math.hypot(forward,side);
  forward/=length;
  side/=length;

  const speed=(
   keys.has('ShiftLeft')||keys.has('ShiftRight')
  )?4.2:2.5;

  const dx=(
   Math.sin(yaw)*forward+
   Math.cos(yaw)*side
  )*speed*dt;

  const dz=(
   Math.cos(yaw)*forward-
   Math.sin(yaw)*side
  )*speed*dt;

  player.position.x=clamp(
   player.position.x+dx,-17.5,17.5
  );

  player.position.z=clamp(
   player.position.z+dz,-73,12
  );

  player.rotation.y=Math.atan2(dx,dz)+Math.PI;
 }

 const swing=moving?Math.sin(time*9)*0.5:0;

 legs[0].rotation.x=swing;
 legs[1].rotation.x=-swing;

 legs[0].userData.lower.rotation.x=Math.max(0,-swing)*0.6;
 legs[1].userData.lower.rotation.x=Math.max(0,swing)*0.6;

 arms[0].rotation.x=-swing*0.6;
 arms[1].rotation.x=swing*0.6;

 human.position.y=moving?Math.abs(Math.sin(time*9))*0.025:0;

 cameraUpdate();
 renderer.render(scene,camera);
}

window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

cameraUpdate();
animate();
</script>
</body>
</html>
